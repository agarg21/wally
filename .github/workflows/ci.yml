name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'Formula/**'
      - '**.md'
  pull_request:
    # `main` and `dev` plus the launch branches, because a pull request stacked
    # onto one of those is still a pull request that has to be green. With `main`
    # alone the branches filter matches on the PR's base, so retargeting a PR
    # from `main` to `dev` or `launch/open-frontier-wally` did not fail CI — it
    # ran no CI at all, and the PR reported nothing rather than reporting a
    # problem.
    branches: [main, dev, 'launch/**']

permissions:
  contents: read

# The console endpoints configure and bake into the binary. They are repository
# variables, not secrets. A fork does not have them unless its owner defines
# them; WALLY_CONSOLE_OPTIONAL lets that build finish with no default console
# instead of failing configure. This repo always sets the variables, so a
# missing one here is still a hard failure. The alt origin is optional and
# unset here.
env:
  WALLY_BAKED_CONSOLE_API_URL: ${{ vars.WALLY_PROD_CONSOLE_API_URL }}
  WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ vars.WALLY_PROD_CONSOLE_WEB_ORIGIN }}
  WALLY_CONSOLE_OPTIONAL: ${{ (github.event.repository.fork || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && '1' || '' }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # SDK Package.swift is swift-tools-version 6.2 (Xcode 26). macos-15 is
    # Xcode 16.4 / Swift 6.1; macos-14 is Xcode 15 / Swift 5.10.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      WALLY_SDK_SWIFT_PATH: ${{ github.workspace }}/.deps/runanywhere-sdks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout SDK Swift tree (MLX runtime)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: RunanywhereAI/runanywhere-sdks
          ref: ff824676b8175c048bd9256012ddff2f592fbffd
          path: .deps/runanywhere-sdks
      - name: Install ninja
        run: brew install ninja
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-ci-macos-arm64
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-macos-arm64-${{ hashFiles('versions.toml') }}
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            build/cargo
          key: cargo-macos-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-arm64-
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kit="${GITHUB_WORKSPACE}/kit"
          bash scripts/build/fetch-kit.sh macos-arm64 "$kit"
          if [[ ! -f "$kit/include/runanywhere/proto/model_types.pb.h" ]]; then
            echo "kit missing generated proto headers; listing prefix:" >&2
            find "$kit" -maxdepth 4 -type d -print >&2
            exit 1
          fi
          if [[ ! -f "$kit/share/runanywhere/SCHEMA_LOCK" ]]; then
            echo "kit missing share/runanywhere/SCHEMA_LOCK" >&2
            find "$kit/share" -print >&2
            exit 1
          fi
      # Fork arm: pinned SDK tree gets a fixed mtime so restored DerivedData stays valid.
      - name: Pin SDK tree mtimes
        run: |
          find .deps/runanywhere-sdks -type f -not -path '*/.git/*' -exec touch -t 202001010000 {} +
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - name: Cache xcodebuild DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: swift/.build/xcode
          key: xcode-mlx-macos-arm64-${{ hashFiles('swift/Package.resolved', 'swift/Package.swift', '.github/workflows/ci.yml') }}
          restore-keys: xcode-mlx-macos-arm64-
      - uses: ./.github/actions/build-wally
        with:
          platform: macos-arm64
          kit-dir: ${{ github.workspace }}/kit
      - name: Unit tests
        if: env.WALLY_CONSOLE_OPTIONAL != '1'
        run: ctest --test-dir build --output-on-failure
      - name: cargo clippy
        env:
          WALLY_BUILD_ENV: ${{ github.workspace }}/build/generated/wally-build.env
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo
        run: cargo clippy --all-targets -- -D warnings
      - name: src/sys/bindings.rs matches the kit
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: |
          set -euo pipefail
          # ~/.cargo/bin comes back from the cache without cargo's install
          # records beside it, and a plain `cargo install` refuses a binary it
          # did not record ("already exists in destination").
          if ! bindgen --version 2>/dev/null | grep -q '0\.73\.2'; then
            cargo install bindgen-cli --version 0.73.2 --locked --force
          fi
          bash scripts/build/gen-sys-bindings.sh --check
      - name: Product e2e (MLX host)
        if: env.WALLY_CONSOLE_OPTIONAL != '1'
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally

